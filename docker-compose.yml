services:
  postgres:
    image: postgres:16-alpine
    container_name: medical_consultant_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medical_consultant
      POSTGRES_USER: medical
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medical}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medical -d medical_consultant"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: medical_consultant_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_NAME: Медицинский консультант
      DATABASE_URL: postgresql://medical:${POSTGRES_PASSWORD:-medical}@postgres:5432/medical_consultant
      UPLOADS_DIR: /app/data/uploads
    env_file:
      - .env
    expose:
      - "8000"
    volumes:
      - backend_uploads:/app/data/uploads

  frontend:
    build:
      context: ./frontend
    container_name: medical_consultant_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"

volumes:
  postgres_data:
  backend_uploads:
