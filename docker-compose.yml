services:
  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      APP_NAME: Локальный медицинский ИИ-навигатор
      DATABASE_PATH: /app/data/medical_consultant.sqlite3
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  backend_data:
